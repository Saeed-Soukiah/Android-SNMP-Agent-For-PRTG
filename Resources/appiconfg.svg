<svg width="1024" height="1024" viewBox="0 0 1024 1024"
     xmlns="http://www.w3.org/2000/svg">

	<!-- Background -->
	<rect width="1024" height="1024" fill="#0A0F1A"/>

	<!-- Neon Blue Glow -->
	<circle cx="512" cy="512" r="340"
			fill="rgba(0,200,255,0.25)"
			filter="url(#blurGlow)" />

	<!-- Hex-Tech OID Tree -->
	<g stroke="#00C8FF" stroke-width="22" fill="none"
	   stroke-linejoin="round" stroke-linecap="round">

		<!-- Top Hex -->
		<polygon points="512,200 568,232 568,296 512,328 456,296 456,232"/>

		<!-- Upper Left Hex -->
		<polygon points="360,350 416,382 416,446 360,478 304,446 304,382"/>

		<!-- Upper Right Hex -->
		<polygon points="664,350 720,382 720,446 664,478 608,446 608,382"/>

		<!-- Bottom Hex -->
		<polygon points="512,650 568,682 568,746 512,778 456,746 456,682"/>

		<!-- Connections -->
		<line x1="512" y1="328" x2="360" y2="382"/>
		<line x1="512" y1="328" x2="664" y2="382"/>
		<line x1="512" y1="328" x2="512" y2="650"/>

	</g>

	<!-- Glow Filter -->
	<defs>
		<filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="80" />
		</filter>
	</defs>

</svg>
